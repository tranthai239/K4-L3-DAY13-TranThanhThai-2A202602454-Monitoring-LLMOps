service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    SLO 99.5% nghĩa là trong cửa sổ 28 ngày, 99.5% request phải thành công
    (trả response_sent) và có latency <= 3000ms. Error budget 0.5% cho phép
    tối đa 0.5% request không đạt SLO. Ví dụ nếu có 10,000 request trong
    cửa sổ 28 ngày, error budget cho phép tối đa 50 request lỗi hoặc chậm
    hơn 3000ms. Ngưỡng 3000ms được chọn dựa trên baseline P95 ~489ms, cho
    margin rộng gấp ~6 lần để phân biệt rõ giữa biến động bình thường và
    sự cố thực sự cần điều tra.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
