alerts:
  - name: high_latency_p95
    severity: warning
    condition: "p95(latency_ms) > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602454
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602454
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: "retrieval_success_rate_pct < 90"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602454
    runbook: docs/alerts.md#alert-3
